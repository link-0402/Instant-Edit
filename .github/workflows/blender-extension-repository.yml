name: Publish Blender Extension Repository

on:
  push:
    branches:
      - main
    paths:
      - 'Blender-Addon/**'
      - 'scripts/package-blender-addon.ps1'
      - 'scripts/generate-blender-repository.ps1'
      - '.github/workflows/blender-extension-repository.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Blender
        env:
          BLENDER_VERSION: 4.5.12
        run: |
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz --directory /tmp
          echo "/tmp/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
          "/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" --version

      - name: Build package and repository index
        shell: pwsh
        run: |
          ./scripts/generate-blender-repository.ps1 -RepositoryPath ./site

      - name: Verify repository metadata
        shell: pwsh
        run: |
          $archivePath = Join-Path $PWD 'site/XIV-Instant-Edit.zip'
          $indexPath = Join-Path $PWD 'site/index.json'
          $entry = (Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json).data |
            Where-Object { $_.id -eq 'xiv_instant_edit' } |
            Select-Object -First 1

          if ($null -eq $entry) {
            throw 'Generated repository index does not contain xiv_instant_edit.'
          }

          $archive = Get-Item -LiteralPath $archivePath
          if ([int64]$entry.archive_size -ne $archive.Length) {
            throw "Archive size mismatch: index=$($entry.archive_size), actual=$($archive.Length)."
          }

          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = ([string]$entry.archive_hash).ToLowerInvariant()
          if ($expectedHash -ne "sha256:$actualHash") {
            throw "Archive hash mismatch: index=$expectedHash, actual=sha256:$actualHash."
          }

          Write-Host "Verified $($archive.Name): $($archive.Length) bytes, sha256:$actualHash"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
